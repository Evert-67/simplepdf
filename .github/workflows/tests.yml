name: SimplePDF tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, mysqli
          tools: composer, wp-cli
          coverage: none
      - name: PHP syntax
        run: find simple-mpdf-print-button tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: for file in simple-mpdf-print-button/assets/*.js; do node --check "$file"; done
      - name: Install locked mPDF dependencies
        working-directory: simple-mpdf-print-button
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - name: Install WordPress test site
        run: |
          mkdir /tmp/simplepdf-wp
          wp core download --path=/tmp/simplepdf-wp --version=6.8.3
          wp config create --path=/tmp/simplepdf-wp --dbname=wordpress --dbuser=root --dbpass=testing --dbhost=127.0.0.1:3306
          wp core install --path=/tmp/simplepdf-wp --url=http://localhost --title=SimplePDF-test --admin_user=testadmin --admin_password=local-ci-only --admin_email=test@example.invalid --skip-email
          zip -qr /tmp/simple-mpdf-print-button-install.zip simple-mpdf-print-button -x '*/composer.json' '*/composer.lock'
          wp plugin install /tmp/simple-mpdf-print-button-install.zip --activate --path=/tmp/simplepdf-wp
      - name: WordPress and PDF regression tests
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress.php" --path=/tmp/simplepdf-wp
      - name: Import standalone website page
        run: |
          wp plugin install wordpress-importer --activate --path=/tmp/simplepdf-wp
          wp import "$GITHUB_WORKSPACE/website/simple-pdf-wordpress-import.xml" --authors=skip --path=/tmp/simplepdf-wp
          wp eval-file "$GITHUB_WORKSPACE/tests/website.php" --path=/tmp/simplepdf-wp
          wp plugin deactivate simple-mpdf-print-button --path=/tmp/simplepdf-wp
          wp eval-file "$GITHUB_WORKSPACE/tests/website.php" --path=/tmp/simplepdf-wp
      - name: Verify generated PDF text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftotext test-output.pdf test-output.txt
          grep -q 'SimplePDF GitHub test' test-output.txt
      - name: Build installable ZIP
        if: matrix.php == '8.3'
        run: zip -qr simple-mpdf-print-button-4.4.2.zip simple-mpdf-print-button -x '*/composer.json' '*/composer.lock'
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: simple-mpdf-print-button-4.4.2
          path: |
            simple-mpdf-print-button-4.4.2.zip
            test-output.pdf

  release:
    needs: [wordpress]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-4.4.2
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simple-mpdf-print-button-4.4.2
          path: dist
      - name: Check plugin archive
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/simple-mpdf-print-button-4.4.2.zip') as archive:
              files = archive.namelist()
              assert 'simple-mpdf-print-button/simple-mpdf-print-button.php' in files
              assert all(name.startswith('simple-mpdf-print-button/') for name in files)
              assert archive.testzip() is None
              assert 'simple-mpdf-print-button/mpdf/autoload.php' in files
          PY
      - name: Publish installable WordPress ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v4.4.2 > /dev/null 2>&1; then
            echo "Release v4.4.2 already exists; preserving published assets."
          else
            gh release create v4.4.2 "dist/simple-mpdf-print-button-4.4.2.zip" --target "$RELEASE_COMMIT" --title "Simple mPDF Print Button 4.4.2" --notes "Download simple-mpdf-print-button-4.4.2.zip below and upload it directly in WordPress via Plugins > Add New > Upload Plugin. Do not use the automatically generated Source code archives. This plugin ZIP includes mPDF and its fonts. Automated tests include installing and activating the packaged ZIP in WordPress." --latest
          fi
